name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Legacy unused_* / dead_code warnings must not block TestFlight; keep errors fatal.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
