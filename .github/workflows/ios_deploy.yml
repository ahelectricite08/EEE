name: iOS TestFlight Deploy

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods xcodeproj
          # Patch xcodeproj to support Xcode 16.4 (object version 70)
          PROJ_RB=$(find /Users/runner/hostedtoolcache -name "project.rb" -path "*/xcodeproj-*/lib/xcodeproj/project.rb" 2>/dev/null | head -1)
          echo "Found xcodeproj at: $PROJ_RB"
          sudo ruby - "$PROJ_RB" <<'RUBY'
            f = ARGV[0]
            c = File.read(f)
            # Show lines 78-92 where the error occurs
            lines = c.lines
            puts "LINES 78-92:"
            lines[77..91].each_with_index { |l, i| puts "#{i+78}: #{l}" }
            # Also show COMPATIBILITY context
            idx = c.index("COMPATIBILITY")
            puts "COMPAT: " + c[idx-5, 200].inspect if idx
          RUBY
          cd ios
          pod install --repo-update

      - name: Setup App Store Connect API key
        run: |
          echo '${{ secrets.ASC_API_KEY_JSON }}' > fastlane/api_key.json

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profiles
        env:
          PROFILE_RUNNER_BASE64: ${{ secrets.PROFILE_RUNNER_BASE64 }}
          PROFILE_EXTENSION_BASE64: ${{ secrets.PROFILE_EXTENSION_BASE64 }}
        run: |
          PP_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_DIR"
          echo "$PROFILE_RUNNER_BASE64" | base64 --decode -o "$PP_DIR/dvcr_appstore.mobileprovision"
          echo "$PROFILE_EXTENSION_BASE64" | base64 --decode -o "$PP_DIR/dvcr_liveactivity_appstore.mobileprovision"

      - name: Build Flutter IPA
        run: flutter build ipa --release --no-codesign

      - name: Run Fastlane beta
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
        run: bundle exec fastlane beta

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain || true
