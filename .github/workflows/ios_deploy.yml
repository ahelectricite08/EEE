name: iOS TestFlight Deploy

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'fastlane/**'
      - 'Gemfile'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods xcodeproj
          CONST_RB=$(gem contents xcodeproj 2>/dev/null | grep "constants.rb" | head -1)
          echo "Found constants at: $CONST_RB"
          if [ -n "$CONST_RB" ]; then
            sudo sed -i '' "s/77 => 'Xcode 16.0',/77 => 'Xcode 16.0',\n      70 => 'Xcode 16.4',/" "$CONST_RB"
            grep "Xcode 16" "$CONST_RB"
          else
            echo "constants.rb not found, skipping patch"
          fi
          cd ios && pod install --repo-update

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install provisioning profiles
        env:
          PROFILE_RUNNER_BASE64: ${{ secrets.PROFILE_RUNNER_BASE64 }}
          PROFILE_EXTENSION_BASE64: ${{ secrets.PROFILE_EXTENSION_BASE64 }}
        run: |
          PP_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_DIR"
          echo "$PROFILE_RUNNER_BASE64" | base64 --decode -o "$PP_DIR/dvcr_appstore.mobileprovision"
          echo "$PROFILE_EXTENSION_BASE64" | base64 --decode -o "$PP_DIR/dvcr_liveactivity_appstore.mobileprovision"

      - name: Build & sign Flutter IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        run: |
          mkdir -p /tmp/private_keys
          echo '${{ secrets.ASC_PRIVATE_KEY_B64 }}' | base64 --decode > /tmp/private_keys/AuthKey_NKM2A26FTD.p8
          xcrun altool --upload-app \
            -f build/ios/ipa/dvcr.ipa \
            -t ios \
            --apiKey NKM2A26FTD \
            --apiIssuer fe23d0fb-17da-41ac-99ae-41286d3dfdeb \
            --private-keys /tmp/private_keys \
            --verbose

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain || true
